[project]
name = "ml_scratch"
version = "0.1.0"
description = "This project is about learning and implementing ML algorithm from scratch to build the foundation on python and actual implementation of ML"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "loguru>=0.7.3",
    "numpy>=2.5.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = ["I001"]  # Ignores import sorting rules across the project